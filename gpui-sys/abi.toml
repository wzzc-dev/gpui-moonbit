# G7 style enum values. These are operand values (not opcodes); they share the
# same constant-generation + cross-boundary drift guard as the opcodes above so
# the Rust decoder and the MoonBit encoder can never disagree on the mapping.
# transform is intentionally absent: gpui 0.2.2 has no Style-level transform.

[align_items]
ALIGN_DEFAULT = 0
ALIGN_START = 1
ALIGN_CENTER = 2
ALIGN_END = 3
ALIGN_STRETCH = 4

[justify_content]
JUSTIFY_DEFAULT = 0
JUSTIFY_START = 1
JUSTIFY_CENTER = 2
JUSTIFY_END = 3
JUSTIFY_SPACE_BETWEEN = 4
JUSTIFY_SPACE_AROUND = 5

[overflow]
OVERFLOW_VISIBLE = 0
OVERFLOW_HIDDEN = 1
OVERFLOW_SCROLL = 2

[cursor]
CURSOR_ARROW = 0
CURSOR_POINTER = 1
CURSOR_TEXT = 2
CURSOR_CROSSHAIR = 3
CURSOR_GRAB = 4
CURSOR_GRABBING = 5
CURSOR_NOT_ALLOWED = 6
CURSOR_EW_RESIZE = 7
CURSOR_NS_RESIZE = 8
CURSOR_COL_RESIZE = 9
CURSOR_ROW_RESIZE = 10
CURSOR_NONE = 11

[position]
POSITION_RELATIVE = 0
POSITION_ABSOLUTE = 1

[text_align]
TEXT_ALIGN_DEFAULT = 0
TEXT_ALIGN_LEFT = 1
TEXT_ALIGN_CENTER = 2
TEXT_ALIGN_RIGHT = 3
TEXT_ALIGN_JUSTIFY = 4

[whitespace]
WHITESPACE_DEFAULT = 0
WHITESPACE_NORMAL = 1
WHITESPACE_NOWRAP = 2
WHITESPACE_PRE = 3
WHITESPACE_PRE_WRAP = 4

# OP_TEXT_RUN style-presence bitflags (issue #91). Fields absent from the flags
# byte keep the run on the base text style, so a run record always carries every
# operand slot and the flags decide which ones apply.

[run_style]
RUN_STYLE_COLOR = 1
RUN_STYLE_WEIGHT = 2
RUN_STYLE_ITALIC = 4
RUN_STYLE_UNDERLINE = 8
RUN_STYLE_STRIKETHROUGH = 16
RUN_STYLE_BACKGROUND = 32

[buffer]
BUFFER_VERSION = 1

[callback]
# Library-owned entry point in the root package `nakake/gpui-bindings`
# (RFC 0004). The build drivers derive the mangled symbol tail from this name.
name = "dispatch_entry"
# MoonBit module that owns the entry point. With `name`, this is everything
# needed to compute the mangled symbol deterministically, which is what lets
# `gpui-sys` build without `mb_symbol.txt` (i.e. when consumed from a registry
# rather than from this checkout). Kept here so build.rs and build.py derive it
# from one declaration instead of each hardcoding the module path.
module = "nakake/gpui-bindings"
params = ["i32", "i32", "i32", "i32", "i32"]
return = "i32"
