[package]
name = "gpui-sys"
version = "0.1.0"
edition = "2024"
# crates.io rejects a publish without `description` and `license`; the values
# mirror `moonbit-bindings/moon.mod` so the two halves of the bridge stay
# consistent (docs/versioning.md keeps their versions in lockstep).
description = "C ABI staticlib exposing Zed's GPUI to MoonBit: retained node tree, rendering, and the event callback bridge."
license = "Apache-2.0"
repository = "https://github.com/nakake/gpui-moonbit"
keywords = ["gpui", "moonbit", "ffi", "gui", "native"]
categories = ["gui", "external-ffi-bindings"]

[features]
# Unit-test-only callback replacement; build.rs also requires the explicit
# GPUI_SYS_ALLOW_TEST_DISPATCH_STUB=1 opt-in so --all-features cannot ship it.
test-dispatch-stub = []
# Headless layout/render harness (`gpui_sys::headless`) for benches and
# integration tests. Pulls in gpui's `test-support` (TestAppContext, headless
# TestWindow, `debug_bounds`). Unit tests get the same machinery through the
# dev-dependency below; neither path is enabled in the staticlib build.
test-support = ["gpui/test-support"]

[lib]
# staticlib is the shipped artifact: the archive references `mb_dispatch`
# (provided by the MoonBit `app` package) as an undefined external, resolved
# at the final executable link. A cdylib would fail to build on that undefined
# symbol. The rlib exists only so out-of-crate dev targets (benches,
# integration tests) can link the crate; `build.sh` links the staticlib and
# ignores the rlib.
crate-type = ["staticlib", "rlib"]

[dependencies]
gpui = "0.2"
# Wake channel for the async event injection queue (RFC 0002): the drain pump
# awaits `wake_rx` on the foreground executor and any producer thread sends
# `()` through `wake_tx`. gpui depends on the same crate; the direct
# dependency pins the channel types in our public-adjacent FFI path.
futures = "0.3"
# Segmented-stack growth for the three functions that walk a committed tree
# recursively (issue #74). Measured at ~70 KB of stack per nesting level in a
# debug build, so a plain 2 MiB thread stack overflows around depth 24-32 —
# and a stack overflow aborts the process instead of surfacing as a status
# code. gpui already pulls this crate in; the direct dependency makes the
# guarantee ours rather than incidental.
stacker = "0.1"

[build-dependencies]
cbindgen = "0.28"
cc = "1"

[dev-dependencies]
# Test-only: gpui's headless TestAppContext harness backs the G24 golden
# layout tests and the G25 fuzz harness. Dev-dependency features never leak
# into the staticlib build (`cargo build` keeps gpui without test-support).
gpui = { version = "0.2", features = ["test-support"] }
criterion = "0.8"
# Same version gpui's `test-support` uses, for seeding the headless
# `TestDispatcher` in the render bench.
rand = "0.9"

[[bench]]
name = "decode_bench"
harness = false
# The bench binary links this crate, whose code references the MoonBit
# callback symbol; `test-dispatch-stub` resolves it without a MoonBit build
# (run with GPUI_SYS_ALLOW_TEST_DISPATCH_STUB=1). `test-support` enables the
# headless render/layout bench. A bare `cargo bench` skips this target
# (required-features unmet) instead of failing the link.
required-features = ["test-dispatch-stub", "test-support"]
